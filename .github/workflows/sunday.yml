name: ZenHR - Sunday Remote Work Request

on:
  schedule:
    # الساعة 9:00 UTC = 12:00 الظهر بتوقيت القاهرة (UTC+3 - التوقيت الصيفي المطبق حاليًا في مصر)
    # لو مصر رجعت UTC+2 (بعد آخر خميس في أكتوبر)، عدّل الرقم هنا لـ 10
    - cron: "0 9 * * 0"
  workflow_dispatch: {}   # عشان تقدر تشغله يدوي من GitHub للتجربة

jobs:
  send-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run automation
        env:
          ZENHR_EMAIL: ${{ secrets.ZENHR_EMAIL }}
          ZENHR_PASSWORD: ${{ secrets.ZENHR_PASSWORD }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python zenhr_automation.py sunday