name: ZenHR - Sunday Remote Work Request

on:
  # الـ schedule الداخلي بتاع GitHub اتشال لإنه كان بيتأخر ساعات كتير عن الميعاد.
  # التشغيل بقى عن طريق خدمة خارجية (cron-job.org) بتنادي على workflow_dispatch في الميعاد بالظبط.
  workflow_dispatch: {}

jobs:
  send-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          ZENHR_EMAIL: ${{ secrets.ZENHR_EMAIL }}
          ZENHR_PASSWORD: ${{ secrets.ZENHR_PASSWORD }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python zenhr_automation_api.py sunday
