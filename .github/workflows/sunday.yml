name: ZenHR - Sunday Remote Work Request

on:
  schedule:
    # 12:20 الظهر بتوقيت القاهرة مباشرة - GitHub بيتصرف مع التوقيت الصيفي تلقائيًا
    - cron: "00 06 * * 0"
      timezone: "Africa/Cairo"
  workflow_dispatch: {}   # عشان تقدر تشغله يدوي من GitHub للتجربة

jobs:
  send-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run automation
        env:
          ZENHR_EMAIL: ${{ secrets.ZENHR_EMAIL }}
          ZENHR_PASSWORD: ${{ secrets.ZENHR_PASSWORD }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python zenhr_automation.py sunday